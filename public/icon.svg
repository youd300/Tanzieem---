<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070A13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sandGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="512" height="512" rx="112" fill="#070A13"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Squircle Ring -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="url(#glassFill)" stroke="url(#neonBorder)" stroke-width="8" filter="url(#glow)"/>
  <rect x="92" y="92" width="328" height="328" rx="74" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Hourglass Shape with Glow -->
  <!-- Top Bulb -->
  <path d="M 170 160 C 170 160 170 236 256 256 C 342 236 342 160 342 160 Z" fill="url(#sandGlow)" opacity="0.3" stroke="url(#sandGlow)" stroke-width="8" stroke-linejoin="round"/>
  <line x1="160" y1="160" x2="352" y2="160" stroke="#00E5FF" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Bottom Bulb -->
  <path d="M 170 352 C 170 352 170 276 256 256 C 342 276 342 352 342 352 Z" fill="url(#sandGlow)" opacity="0.75" stroke="url(#sandGlow)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="160" y1="352" x2="352" y2="352" stroke="#A855F7" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Sand Stream & Particles -->
  <line x1="256" y1="230" x2="256" y2="295" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="256" cy="315" r="4" fill="#00E5FF"/>
  <circle cx="242" cy="335" r="3" fill="#38BDF8"/>
  <circle cx="270" cy="332" r="3" fill="#C084FC"/>
  <circle cx="256" cy="340" r="4" fill="#FFFFFF"/>

  <!-- Center Growth Accent Spark -->
  <polygon points="256,190 262,204 276,204 265,214 269,228 256,218 243,228 247,214 236,204 250,204" fill="#FFFFFF" filter="url(#glow)" opacity="0.9"/>
</svg>
